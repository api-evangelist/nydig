description: 'NYDIG is a vertically-integrated bitcoin and power company founded in 2017, operating at the
  intersection of power, compute, and sound money. It develops power infrastructure supporting bitcoin''s
  proof-of-work security and low-cost energy, and provides institutional-grade financial infrastructure
  including regulated bitcoin custody, spot and derivatives trading, structuring, and financing. NYDIG was
  surfaced as a portfolio company of bessemer-venture-partners and added to the API Evangelist network.
  It exposes no public developer API, developer portal, or API documentation; access is through the
  authenticated institutional platform at app.nydig.com.'
